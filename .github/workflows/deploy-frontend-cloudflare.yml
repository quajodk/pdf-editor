# Build the React frontend and publish to Cloudflare Pages via Wrangler.
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN        — token with the "Pages: Edit" permission
#                                 for the target account.
#   CLOUDFLARE_ACCOUNT_ID       — your Cloudflare account id.
#
# Required GitHub repo variables (Settings → Secrets and variables →
# Actions → Variables):
#   CLOUDFLARE_PAGES_PROJECT    — Pages project name, e.g. "pdf-editor".
#
# Optional GitHub repo variables (build-time, baked into the bundle —
# CRA only inlines variables that start with REACT_APP_):
#   REACT_APP_API_URL           — Backend URL, e.g. https://api.example.com.
#                                 The current frontend is fully client-side
#                                 and does not call this URL yet; the var is
#                                 wired so future backend integration works
#                                 with one config change.
#
# Trigger: pushes to main/master that touch the frontend, or manual dispatch.
name: Deploy frontend → Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # CRA only inlines REACT_APP_* env vars into the bundle.
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          CI: 'false' # tolerate warnings; CRA elevates warnings to errors otherwise
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/build --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
