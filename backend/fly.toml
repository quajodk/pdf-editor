# Fly.io launch config for the pdf-editor backend.
#
# Adjust `app` to your unique Fly app name (must match the app you created
# with `flyctl apps create`). The deploy workflow expects FLY_API_TOKEN to
# be set as a GitHub repo secret.

app = "pdf-editor-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # Set CORS_ORIGINS in production via:
  #   flyctl secrets set CORS_ORIGINS=https://your-frontend.pages.dev
  # (kept out of [env] so it can be updated without redeploying.)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
